services:
  - type: web
    name: madrassati-cem-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://ace-gist-l0z9n.web.app,https://ace-gist-l0z9n.firebaseapp.com
