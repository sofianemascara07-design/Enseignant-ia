name: Deploy Madrassati CEM (Render + Firebase Hosting)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run lint

      - name: Build frontend & server
        env:
          VITE_API_URL: ${{ secrets.RENDER_API_URL }}
        run: npm run build

      - name: Deploy to Firebase Hosting & Firestore Rules
        uses: w9jds/firebase-action@v15.4.0
        with:
          args: deploy --only hosting,firestore:rules --project ace-gist-l0z9n
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Trigger Render Deploy Hook (optional)
        if: secrets.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
